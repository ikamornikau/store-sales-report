services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until wget -q -T 1 -O /dev/null http://backend:8080/ready; do
          sleep 0.5
        done
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
